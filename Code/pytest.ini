[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -q
markers =
    business_rule: CV052 automated suite for critical business rules
    uat: CV053 user acceptance tests for Requester, Processor, and Admin
    kpi_evaluation: CV054 KPI calculation and target comparison tests
    release_candidate: CV055 high-priority fix regression tests
    ui_complete: CV056 complete UI states and responsive behavior tests
